services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [apivigil]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [apivigil]

  metrics-service:
    build:
      context: .
      dockerfile: metrics-service/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/apivigil}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      METRICS_PORT: ${METRICS_PORT:-4001}
    depends_on: [mongo, redis]
    networks: [apivigil]

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      AI_PORT: 5000
    networks: [apivigil]

  ai-worker:
    build:
      context: .
      dockerfile: ai-service/worker.Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/apivigil}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on: [mongo, redis]
    networks: [apivigil]

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-5000}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/apivigil}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      METRICS_SERVICE_URL: ${METRICS_SERVICE_URL:-http://metrics-service:4001}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:5000}
      AI_ENABLED: ${AI_ENABLED:-true}
    depends_on: [mongo, redis, metrics-service, ai-service]
    networks: [apivigil]
    ports:
      - "${PORT:-5000}:5000"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on: [server]
    networks: [apivigil]
    ports:
      - "${CLIENT_PORT:-3000}:80"

networks:
  apivigil:
    driver: bridge

volumes:
  mongo_data:
